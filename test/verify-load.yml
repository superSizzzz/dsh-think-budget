# 一次性隔离实例的 overlay —— 只用来验证插件能不能被 dsh 的 loader 真的装载
# （解析 file:// → import .ts → 校验 config → 调 apply）。
#
# 把 <plugin-dir> 换成你的插件目录（用正斜杠），并先跑过一次
# `node scripts/link-deps.mjs`。
#
# 用法（起一个不占 3080、不弹浏览器的实例，验证完把它关掉）：
#   dsh --profile web --patch <plugin-dir>/test/verify-load.yml --port 3199 --no-open
#
# 第一段禁用飞书桥：验证过程不该往真实飞书发消息。没装飞书桥的部署可以删掉
# 那两行（留着也无妨，id 匹配不到就什么都不做）。
#
# 第二段挂上待验证的插件，并把装载留痕写进 test/.verify-applied.jsonl ——
# 那个文件出现、且带 "event":"applied" 行，就证明 apply 真的跑到了。
- id: feishu-bridge
  disabled: true

- insert:
    - id: think-budget
      name: 'file:///<plugin-dir>/src/index.ts'
      config:
        enabled: true
        logPath: '<plugin-dir>/test/.verify-applied.jsonl'
